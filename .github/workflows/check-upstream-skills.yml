name: Check upstream skills

on:
  pull_request:
    paths:
      - catalog.json
      - licenses/**
      - scripts/update_skills.py
      - skills/**
      - .github/workflows/check-upstream-skills.yml
  push:
    branches: [main]
    paths:
      - catalog.json
      - licenses/**
      - scripts/update_skills.py
      - skills/**
      - .github/workflows/check-upstream-skills.yml
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-skills-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the pinned skill catalog
        run: |
          python scripts/update_skills.py --check
          git diff --check -- . ':(exclude)licenses/**'
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        name: Verify upstream content matches its pinned commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_skills.py --verify-pins

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: open_pr
        name: Wait for any existing catalog update review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs=$(gh pr list --state open --base main --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/upstream-skills-"))] | length')
          if [ "$open_prs" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An upstream-skills update PR is already open; waiting for its review."
          fi
      - if: steps.open_pr.outputs.skip != 'true'
        name: Check pinned upstream copies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_skills.py
      - if: steps.open_pr.outputs.skip != 'true'
        name: Validate refreshed catalog
        run: |
          python scripts/update_skills.py --check
          git diff --check -- . ':(exclude)licenses/**'
      - if: steps.open_pr.outputs.skip != 'true'
        name: Open a reviewable update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "No upstream changes to propose."
            exit 0
          fi
          branch="automation/upstream-skills-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json licenses/ skills/
          git commit -m "chore: update curated upstream skills"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update curated upstream skills" \
            --body-file - <<'BODY'
          ## Summary

          Refresh selected skill files and license notices from their pinned upstream repositories. The diff is untrusted third-party agent instructions; review it before merging. This workflow does not merge its own pull request.

          ## Verification

          - Validated each catalog path and skill name against upstream.
          - Preserved source license files.
          - Validated the complete local catalog.

          This pull request was opened automatically by the GitHub Actions workflow on behalf of the repository owner.
          BODY
